name: Novo application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novo-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://novo:novo@127.0.0.1:5432/novo_checks
      NEXTAUTH_SECRET: isolated-ci-placeholder-never-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc --noEmit --pretty false --incremental false
      - name: Lint
        run: npm run lint
      - name: Regression tests
        run: npm test -- --runInBand --silent
