name: Novo Companion Windows
on:
  push:
    branches: [main, codex/active-project-assistant]
    paths: ['companion/windows/**', '.github/workflows/companion-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: companion/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Frontend checks
        run: node --import ./tests/setup.mjs --test --test-concurrency=1 "tests/**/*.test.mjs"
      - name: Build registered hook resource
        run: cargo build -p coucou-hook --release --locked
      - name: Native and protocol checks
        run: |
          cargo test --workspace --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path tests/project-work-harness/Cargo.toml --locked -j 2
          exit $LASTEXITCODE
      - name: Build installers from this commit
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: novo-companion-windows-${{ github.sha }}
          path: companion/windows/release/*
          if-no-files-found: error
          retention-days: 3
